name: GladLang Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Get GladLang Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: bash
        run: |
          GLADLANG_VERSION=$(grep -E '^__version__[[:space:]]*=' src/gladlang/version.py | sed -E 's/^[^"]*"([^"]*)".*$/\1/')

          if [ -z "$GLADLANG_VERSION" ]; then
            echo "Could not find __version__ in src/gladlang/version.py"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$TAG_VERSION" != "$GLADLANG_VERSION" ]; then
            echo "Version mismatch!"
            echo "Git tag: $TAG_VERSION"
            echo "Source version: $GLADLANG_VERSION"
            exit 1
          fi

          echo "GladLang version: $GLADLANG_VERSION"
          echo "version=$GLADLANG_VERSION" >> "$GITHUB_OUTPUT"

  tests:
    name: Release Test
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install GladLang
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run full test suite
        run: |
          python scripts/run_tests.py

      - name: Compile source and tests
        run: |
          python -m compileall -q src tests scripts

  windows:
    name: Windows x64
    needs:
      - version
      - tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka

      - name: Cache Nuitka compiler artifacts (Windows x64)
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-windows-x64-py312-msvc-v1-${{ hashFiles('run.py', 'src/**/*.py', 'pyproject.toml', 'setup.py', 'setup.cfg', '.github/workflows/release.yml') }}
          restore-keys: |
            nuitka-windows-x64-py312-msvc-v1-

      - name: Build standalone
        shell: pwsh
        env:
          PYTHONPATH: src
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m nuitka `
            --mode=onefile `
            --output-dir=dist `
            --output-filename=gladlang.exe `
            --include-package=gladlang `
            --windows-icon-from-ico=favicon.ico `
            --msvc=latest `
            --assume-yes-for-downloads `
            run.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\gladlang.exe")) {
            throw "Nuitka did not produce dist\gladlang.exe"
          }
          & "dist\gladlang.exe" --version

      - name: Build installer
        shell: pwsh
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          iscc installer\GladLang.iss

      - name: Package
        shell: pwsh
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force package\Windows | Out-Null

          Copy-Item `
            "dist\gladlang.exe" `
            "package\Windows\gladlang.exe"

          Compress-Archive `
            -Path "package\Windows\gladlang.exe" `
            -DestinationPath "release\GladLang-$env:GLADLANG_VERSION-Windows-x64.zip" `
            -Force

          Copy-Item `
            "installer-output\GladLang-$env:GLADLANG_VERSION-Setup.exe" `
            "release\GladLang-$env:GLADLANG_VERSION-Setup.exe"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-Windows-x64
          path: release/

  linux:
    name: Linux x64
    needs:
      - version
      - tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --version

      - name: Cache Nuitka compiler artifacts (Linux x64)
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-linux-x64-py312-gcc-v1-${{ hashFiles('run.py', 'src/**/*.py', 'pyproject.toml', 'setup.py', 'setup.cfg', '.github/workflows/release.yml') }}
          restore-keys: |
            nuitka-linux-x64-py312-gcc-v1-

      - name: Build standalone
        env:
          PYTHONPATH: src
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m nuitka \
            --mode=onefile \
            --output-dir=dist \
            --output-filename=gladlang \
            --include-package=gladlang \
            --assume-yes-for-downloads \
            run.py

      - name: Verify executable
        run: |
          test -x dist/gladlang
          ./dist/gladlang --version

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/Linux

          cp dist/gladlang package/Linux/gladlang
          chmod +x package/Linux/gladlang

          cd package/Linux

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-Linux-x64
          path: release/

  macos-arm64:
    name: macOS ARM64
    needs:
      - version
      - tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka

      - name: Install ccache
        run: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/ccache" --version

      - name: Cache Nuitka compiler artifacts (macOS ARM64)
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-macos-arm64-py312-clang-v1-${{ hashFiles('run.py', 'src/**/*.py', 'pyproject.toml', 'setup.py', 'setup.cfg', '.github/workflows/release.yml') }}
          restore-keys: |
            nuitka-macos-arm64-py312-clang-v1-

      - name: Build standalone
        env:
          PYTHONPATH: src
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m nuitka \
            --mode=onefile \
            --output-dir=dist \
            --output-filename=gladlang \
            --include-package=gladlang \
            --assume-yes-for-downloads \
            run.py

      - name: Verify executable
        run: |
          test -x dist/gladlang
          ./dist/gladlang --version

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/macOS-arm64

          cp dist/gladlang package/macOS-arm64/gladlang
          chmod +x package/macOS-arm64/gladlang

          cd package/macOS-arm64

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-macOS-arm64
          path: release/

  macos-x64:
    name: macOS Intel x64
    needs:
      - version
      - tests
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka

      - name: Cache Nuitka compiler artifacts (macOS Intel x64)
        uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-macos-intel-x64-py312-clang-v1-${{ hashFiles('run.py', 'src/**/*.py', 'pyproject.toml', 'setup.py', 'setup.cfg', '.github/workflows/release.yml') }}
          restore-keys: |
            nuitka-macos-intel-x64-py312-clang-v1-

      - name: Build standalone
        env:
          PYTHONPATH: src
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          python -m nuitka \
            --mode=onefile \
            --output-dir=dist \
            --output-filename=gladlang \
            --include-package=gladlang \
            --assume-yes-for-downloads \
            run.py

      - name: Verify executable
        run: |
          test -x dist/gladlang
          ./dist/gladlang --version

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/macOS-x64

          cp dist/gladlang package/macOS-x64/gladlang
          chmod +x package/macOS-x64/gladlang

          cd package/macOS-x64

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-macOS-x64
          path: release/

  release:
    name: GladLang Release
    needs:
      - version
      - windows
      - linux
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: GladLang-Windows-x64
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v8
        with:
          name: GladLang-Linux-x64
          path: release

      - name: Download macOS ARM64
        uses: actions/download-artifact@v8
        with:
          name: GladLang-macOS-arm64
          path: release

      - name: Download macOS x64
        uses: actions/download-artifact@v8
        with:
          name: GladLang-macOS-x64
          path: release

      - name: Prepare All Platforms
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-Windows-x64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-Linux-x64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-arm64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-x64"

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-Windows-x64.zip" \
            -d windows-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            -d linux-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            -d macos-arm64-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            -d macos-x64-temp

          cp windows-temp/gladlang.exe \
            "all-platforms/GladLang-${GLADLANG_VERSION}-Windows-x64/gladlang.exe"

          cp linux-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-Linux-x64/gladlang"

          cp macos-arm64-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-arm64/gladlang"

          cp macos-x64-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-x64/gladlang"

          cd all-platforms

          zip -r \
            "../release/GladLang-${GLADLANG_VERSION}-All-Platforms.zip" \
            "GladLang-${GLADLANG_VERSION}-Windows-x64" \
            "GladLang-${GLADLANG_VERSION}-Linux-x64" \
            "GladLang-${GLADLANG_VERSION}-macOS-arm64" \
            "GladLang-${GLADLANG_VERSION}-macOS-x64"

      - name: Generate checksums
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release

          sha256sum \
            "GladLang-${GLADLANG_VERSION}-Windows-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-Setup.exe" \
            "GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            "GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-All-Platforms.zip" \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/GladLang-${{ needs.version.outputs.version }}-Windows-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-Setup.exe
            release/GladLang-${{ needs.version.outputs.version }}-Linux-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-macOS-arm64.zip
            release/GladLang-${{ needs.version.outputs.version }}-macOS-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-All-Platforms.zip
            release/SHA256SUMS.txt
          generate_release_notes: true