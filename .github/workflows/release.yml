name: GladLang Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Get GladLang Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: bash
        run: |
          GLADLANG_VERSION=$(grep -E '^__version__[[:space:]]*=' src/gladlang/version.py | sed -E 's/^[^"]*"([^"]*)".*$/\1/')

          if [ -z "$GLADLANG_VERSION" ]; then
            echo "Could not find __version__ in src/gladlang/version.py"
            exit 1
          fi

          echo "GladLang version: $GLADLANG_VERSION"
          echo "version=$GLADLANG_VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone
        shell: pwsh
        run: |
          pyinstaller run.py `
            --paths src `
            --onefile `
            --name gladlang `
            --icon favicon.ico `
            --clean `
            --noconfirm

      - name: Build installer
        shell: pwsh
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          iscc installer\GladLang.iss

      - name: Package
        shell: pwsh
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          New-Item -ItemType Directory -Force package\Windows | Out-Null

          Copy-Item `
            "dist\gladlang.exe" `
            "package\Windows\gladlang.exe"

          Compress-Archive `
            -Path "package\Windows\gladlang.exe" `
            -DestinationPath "release\GladLang-$env:GLADLANG_VERSION-Windows-x64.zip" `
            -Force

          Copy-Item `
            "installer-output\GladLang-$env:GLADLANG_VERSION-Setup.exe" `
            "release\GladLang-$env:GLADLANG_VERSION-Setup.exe"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-Windows-x64
          path: release/

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone
        run: |
          pyinstaller run.py \
            --paths src \
            --onefile \
            --name gladlang \
            --clean \
            --noconfirm

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/Linux

          cp dist/gladlang package/Linux/gladlang
          chmod +x package/Linux/gladlang

          cd package/Linux

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-Linux-x64
          path: release/

  macos-arm64:
    name: macOS ARM64
    needs: version
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone
        run: |
          pyinstaller run.py \
            --paths src \
            --onefile \
            --name gladlang \
            --clean \
            --noconfirm

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/macOS-arm64

          cp dist/gladlang package/macOS-arm64/gladlang
          chmod +x package/macOS-arm64/gladlang

          cd package/macOS-arm64

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-macOS-arm64
          path: release/

  macos-x64:
    name: macOS Intel x64
    needs: version
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone
        run: |
          pyinstaller run.py \
            --paths src \
            --onefile \
            --name gladlang \
            --clean \
            --noconfirm

      - name: Package
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release package/macOS-x64

          cp dist/gladlang package/macOS-x64/gladlang
          chmod +x package/macOS-x64/gladlang

          cd package/macOS-x64

          zip \
            "../../release/GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            gladlang

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: GladLang-macOS-x64
          path: release/

  release:
    name: GladLang Release
    needs:
      - version
      - windows
      - linux
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: GladLang-Windows-x64
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v8
        with:
          name: GladLang-Linux-x64
          path: release

      - name: Download macOS ARM64
        uses: actions/download-artifact@v8
        with:
          name: GladLang-macOS-arm64
          path: release

      - name: Download macOS x64
        uses: actions/download-artifact@v8
        with:
          name: GladLang-macOS-x64
          path: release

      - name: Prepare All Platforms
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-Windows-x64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-Linux-x64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-arm64"
          mkdir -p "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-x64"

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-Windows-x64.zip" \
            -d windows-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            -d linux-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            -d macos-arm64-temp

          unzip -q \
            "release/GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            -d macos-x64-temp

          cp windows-temp/gladlang.exe \
            "all-platforms/GladLang-${GLADLANG_VERSION}-Windows-x64/gladlang.exe"

          cp linux-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-Linux-x64/gladlang"

          cp macos-arm64-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-arm64/gladlang"

          cp macos-x64-temp/gladlang \
            "all-platforms/GladLang-${GLADLANG_VERSION}-macOS-x64/gladlang"

          cd all-platforms

          zip -r \
            "../release/GladLang-${GLADLANG_VERSION}-All-Platforms.zip" \
            "GladLang-${GLADLANG_VERSION}-Windows-x64" \
            "GladLang-${GLADLANG_VERSION}-Linux-x64" \
            "GladLang-${GLADLANG_VERSION}-macOS-arm64" \
            "GladLang-${GLADLANG_VERSION}-macOS-x64"

      - name: Generate checksums
        env:
          GLADLANG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release

          sha256sum \
            "GladLang-${GLADLANG_VERSION}-Windows-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-Setup.exe" \
            "GladLang-${GLADLANG_VERSION}-Linux-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-macOS-arm64.zip" \
            "GladLang-${GLADLANG_VERSION}-macOS-x64.zip" \
            "GladLang-${GLADLANG_VERSION}-All-Platforms.zip" \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/GladLang-${{ needs.version.outputs.version }}-Windows-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-Setup.exe
            release/GladLang-${{ needs.version.outputs.version }}-Linux-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-macOS-arm64.zip
            release/GladLang-${{ needs.version.outputs.version }}-macOS-x64.zip
            release/GladLang-${{ needs.version.outputs.version }}-All-Platforms.zip
            release/SHA256SUMS.txt
          generate_release_notes: true