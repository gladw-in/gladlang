name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Run GladLang Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GladLang
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run test suite
        run: |
          mkdir -p tests/result
          python scripts/run_tests.py 2>&1 | tee "tests/result/test-results-${{ matrix.python-version }}.txt"
          exit ${PIPESTATUS[0]}

      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gladlang-test-results-python-${{ matrix.python-version }}
          path: tests/result/test-results-${{ matrix.python-version }}.txt
          retention-days: 14
